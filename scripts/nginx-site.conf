# Static SPA for a 1 vCPU / 6GB box (nginx only — do not run Node here).
#
# In /etc/nginx/nginx.conf (http-level, not this file):
#   worker_processes 1;
#   worker_rlimit_nofile 2048;
#   events { worker_connections 768; multi_accept on; }
#   http {
#     sendfile on;
#     tcp_nopush on;
#     tcp_nodelay on;
#     keepalive_timeout 15;
#     ...
#   }
#
# gzip_static serves dist/*.gz produced by `npm run build` (scripts/precompress.js)
# so the single core does not recompress JS on every request.
# If `nginx -t` fails on gzip_static, comment that one line — on-the-fly gzip still works.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/dark-fantasy;
    index index.html;
    server_name _;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15;
    keepalive_requests 100;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    open_file_cache max=400 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Vite hashed bundles — cache forever, skip access log (I/O on 1 core).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # HTML must revalidate so clients pick up new hashed JS after deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
